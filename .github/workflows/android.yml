name: Build Android APK

# Runs on every push to main, or by hand: Actions → Build Android APK → Run workflow.
# The APK appears under the finished run, in "Artifacts".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
      APP_ID: ${{ vars.APP_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      # The app files can be at the top of the repository or in a folder (e.g. body-scan-tracker-app/).
      - name: Find the app files
        run: |
          if ! find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' | grep -q .; then
            Z=$(find . -maxdepth 3 -name '*.zip' | head -1)
            if [ -n "$Z" ]; then echo "Unzipping $Z"; unzip -q -o "$Z" -d .; fi
          fi
          P=$(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$P" ]; then
            echo "::error::No package.json in the repository. Upload the files that are inside body-scan-tracker-app (package.json, app.config.ts, app, src …)."
            exit 1
          fi
          echo "App folder: $(dirname "$P")"
          echo "APP_DIR=$(dirname "$P")" >> "$GITHUB_ENV"

      - name: Check the website address
        run: |
          if [ -z "$EXPO_PUBLIC_API_BASE_URL" ]; then
            echo "::warning::No website address yet: the APK is built, but it can't connect to the website. When the website is up, add API_BASE_URL (e.g. https://your-domain.com) in Settings → Secrets and variables → Actions → Variables, and run this again."
          else
            echo "Website: $EXPO_PUBLIC_API_BASE_URL"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # react-dom is installed with the matching version, so npm doesn't pull a newer one that clashes with react.
      - name: Install packages
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npx expo install react react-dom react-native expo-router expo-constants expo-linking expo-status-bar expo-splash-screen expo-system-ui expo-localization expo-secure-store expo-file-system expo-camera expo-image-picker expo-document-picker expo-media-library expo-notifications expo-print expo-sharing expo-web-browser expo-build-properties react-native-svg react-native-safe-area-context react-native-screens react-native-gesture-handler react-native-reanimated react-native-worklets @react-native-community/datetimepicker
          npm install --legacy-peer-deps @infinitered/react-native-mlkit-text-recognition react-native-document-scanner-plugin

      # Optional: notifications from the website. Add the secret GOOGLE_SERVICES_JSON (the whole google-services.json file).
      - name: Firebase file (optional)
        working-directory: ${{ env.APP_DIR }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; echo "Firebase on"; else echo "Firebase off (optional)"; fi

      - name: Create the Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build the APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: body-scan-tracker-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
